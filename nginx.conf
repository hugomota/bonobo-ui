# Vite's files under /assets/ have a hash in their name: cached for good.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Storybook (static build). It needs inline scripts and frames its own
    # preview page, so it gets a looser policy than the demo; still only
    # framed by itself and only reachable from the home network (lan-only).
    location /storybook/ {
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'none'" always;
        try_files $uri $uri/ =404;
    }
}
